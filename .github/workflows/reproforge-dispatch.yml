name: ReproForge issue automation

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitHub issue URL to reproduce
        required: true
        type: string
      image:
        description: Optional Docker image override
        required: false
        type: string
      harness:
        description: Optional harness id
        required: false
        type: string
      harness_image:
        description: Optional Docker image containing the harness executable
        required: false
        type: string
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: reproforge-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  reproduce:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'repro') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       (github.event.comment.body == '/repro' || startsWith(github.event.comment.body, '/repro ')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Resolve issue inputs
        id: inputs
        env:
          DISPATCH_ISSUE_URL: ${{ inputs.issue_url || '' }}
          EVENT_ISSUE_URL: ${{ github.event.issue.html_url || '' }}
        shell: bash
        run: |
          set -euo pipefail
          issue_url="$DISPATCH_ISSUE_URL"
          if [[ -z "$issue_url" ]]; then issue_url="$EVENT_ISSUE_URL"; fi
          if [[ -z "$issue_url" ]]; then
            echo "No issue URL could be resolved" >&2
            exit 2
          fi
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
      - name: Run ReproForge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.inputs.outputs.issue_url }}
          IMAGE: ${{ inputs.image || '' }}
          HARNESS: ${{ inputs.harness || '' }}
          HARNESS_IMAGE: ${{ inputs.harness_image || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(issue "$ISSUE_URL" --post-comment)
          if [[ -n "$IMAGE" ]]; then args+=(--image "$IMAGE"); fi
          if [[ -n "$HARNESS" ]]; then args+=(--harness "$HARNESS"); fi
          if [[ -n "$HARNESS_IMAGE" ]]; then args+=(--harness-image "$HARNESS_IMAGE"); fi
          reproforge "${args[@]}"
      - name: Collect archived evidence
        if: always()
        run: |
          mkdir -p workflow-artifacts
          if [[ -d "$HOME/.reproforge/runs" ]]; then
            cp -R "$HOME/.reproforge/runs" workflow-artifacts/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproforge-evidence-${{ github.run_id }}
          path: workflow-artifacts
          if-no-files-found: warn
          retention-days: 14
