name: ReproForge manual issue run

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: GitHub issue URL to reproduce
        required: true
        type: string
      image:
        description: Docker image containing the target project's runtime
        required: true
        type: string
      harness:
        description: Optional harness id (leave empty for deterministic repository tests only)
        required: false
        type: string
      harness_image:
        description: Optional Docker image containing the harness executable
        required: false
        type: string

permissions:
  contents: read
  issues: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run ReproForge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ inputs.issue_url }}
          IMAGE: ${{ inputs.image }}
          HARNESS: ${{ inputs.harness }}
          HARNESS_IMAGE: ${{ inputs.harness_image }}
        shell: bash
        run: |
          set -euo pipefail
          args=(issue "$ISSUE_URL" --image "$IMAGE")
          if [[ -n "$HARNESS" ]]; then args+=(--harness "$HARNESS"); fi
          if [[ -n "$HARNESS_IMAGE" ]]; then args+=(--harness-image "$HARNESS_IMAGE"); fi
          reproforge "${args[@]}"
      - name: Collect archived evidence
        if: always()
        run: |
          mkdir -p workflow-artifacts
          if [[ -d "$HOME/.reproforge/runs" ]]; then
            cp -R "$HOME/.reproforge/runs" workflow-artifacts/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproforge-evidence
          path: workflow-artifacts
          if-no-files-found: warn
          retention-days: 14
