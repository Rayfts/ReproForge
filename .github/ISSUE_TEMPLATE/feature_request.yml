name: Feature request
description: Propose an improvement to ReproForge
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What maintainer or reproducibility problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow or interface you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds, or simpler approaches you considered.
  - type: textarea
    id: evidence
    attributes:
      label: Ecosystem / harness evidence
      description: If this concerns a third-party harness, package manager, or sandbox, link its official repository/docs and avoid guessed capabilities.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked for an existing issue describing the same request.
          required: true