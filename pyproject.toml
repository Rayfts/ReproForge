[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reproforge"
version = "0.1.0"
description = "Evidence-first bug reproduction for software repositories"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ReproForge contributors" }]
keywords = ["bugs", "reproduction", "github", "agents", "testing", "sandbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
tree-sitter = ["tree-sitter>=0.24,<0.26"]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
reproforge = "reproforge.cli.app:app"

[project.urls]
Homepage = "https://github.com/Rayfts/ReproForge"
Repository = "https://github.com/Rayfts/ReproForge"
Issues = "https://github.com/Rayfts/ReproForge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reproforge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that require a working Docker daemon",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reproforge"]
mypy_path = "src"
warn_unused_ignores = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["reproforge"]
